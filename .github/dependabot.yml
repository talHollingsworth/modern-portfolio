# Weekly update PRs for npm packages and for the SHA-pinned GitHub Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match the Conventional Commits check required on pull requests.
    commit-message:
      prefix: chore
      include: scope
    # The Next.js ESLint toolchain does not support TypeScript 7 yet.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # All codeql-action steps must share one version
      codeql-action:
        patterns:
          - "github/codeql-action*"
